<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>货件 · 物流追踪</title><link rel="icon" href="data:,"><link rel="stylesheet" href="style.css"></head><body>
<div class="shell"><aside class="sidebar"><div class="brand"><span class="brandmark">●</span> 货件追踪</div><div class="side-label">工作台</div><div class="side-active">▦ <span>所有货件</span></div><div class="side-foot" id="side-updated"></div></aside>
<main><header class="top"><div><div class="eyebrow">物流工作台 <span>/</span> 货件</div><h1>货件追踪</h1><p>所有货物，一目了然</p></div><div class="updated"><span></span> <b id="updated-text" style="font-weight:inherit">读取中…</b></div></header>
<section class="overview"><div><span class="over-label">本周预计到港</span><strong id="week-count">—</strong><p id="week-range"></p></div><div class="next"><span>最近预计到港</span><strong id="next-date">—</strong><small id="next-note">预计到港 · 非最终送达</small></div></section>
<section class="toolbar" aria-label="搜索与筛选"><label class="search"><span>⌕</span><input id="search" type="search" placeholder="搜索产品、厂家或目的地" aria-label="搜索产品、厂家或目的地"></label><div class="control-row"><div class="filters" role="group" aria-label="状态筛选"><button data-filter="all" class="active">全部 <b id="count-all"></b></button><button data-filter="transit">在途 <b id="count-transit"></b></button><button data-filter="decision">待决定 <b id="count-decision"></b></button><button data-filter="done">完成 <b id="count-done"></b></button></div><div class="view-switch" role="group" aria-label="视图切换"><button data-view="cards" class="active" aria-label="卡片视图" title="卡片视图">▦</button><button data-view="list" aria-label="列表视图" title="列表视图">☰</button></div></div></section>
<div class="content"><div class="results"><div class="section-title"><div><h2 id="heading">全部货件</h2></div><span id="result-count"></span></div><div id="cards" class="cards"></div><div id="empty" hidden>没有找到符合条件的货件。试试其他搜索或筛选。</div></div><aside class="summary"><div class="summary-head"><h2>待决定 <span id="summary-count"></span></h2><p>需要 Nick 拍板的事项</p></div><div id="decision-list"></div><button id="show-decisions">查看待决定 <span>→</span></button><div class="summary-note">一般资料待补会留在货件详情中，不计入待决定。</div></aside></div></main></div>
<nav class="mobile-nav" aria-label="底部导航"><button data-nav="all" class="active">▦<span>货件</span></button><button data-nav="decision">◉<span>待决定</span></button><button data-nav="done">✓<span>已完成</span></button></nav><script src="map.js"></script><script src="app.js"></script></body></html>
