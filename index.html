<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>货运追踪</title>
<style>body{background:#0d1117;color:#e6edf3;font-family:system-ui;margin:0;padding:20px}h1{font-size:20px}.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}.c{background:#161b22;border:1px solid #30363d;border-radius:12px;padding:16px}.t{display:inline-block;padding:2px 8px;border-radius:8px;font-size:12px;margin-right:6px}.air{background:#1f6feb}.sea{background:#238636}.st{background:#9e6a03}.k{color:#8b949e;font-size:13px}.w{color:#f0883e}</style>
<h1>📦 货运追踪 Dashboard <span class="k" id="u"></span></h1><div class="g" id="g"></div>
<script>fetch('shipments.json?'+Date.now()).then(r=>r.json()).then(d=>{u.textContent='更新于 '+d.updated;g.innerHTML=d.shipments.map(s=>`<div class=c><span class="t ${s.mode}">${s.mode=='air'?'✈ 空运':'🚢 海运'}</span><span class="t st">${s.status}</span><h3>${s.tracking_no}</h3><div class=k>${s.carrier} · 唛头 ${s.mark} · ${s.ctns} 箱 · ${s.weight}</div><p>货物：<b class="${s.contents=='待确认'?'w':''}">${s.contents}</b> · 厂家：<b class="${s.supplier=='待确认'?'w':''}">${s.supplier}</b></p><div class=k>国内段：${s.china_ref}</div><p>${s.last_event||''}</p><div class=k>检查：${s.last_checked}</div></div>`).join('')})</script></html>
