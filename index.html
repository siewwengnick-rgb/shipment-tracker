<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#244b3e">
<title>集运追踪</title>
<style>
:root{
  --floor:#f7f5f0;
  --card:#fffefa;
  --ink:#252c28;
  --ink-2:#5b625d;
  --line:#dedfd7;
  --green:#244b3e;
  --green-ink:#f3f6f1;
  --green-dim:#d5e4da;
  --amber:#e2a11a;
  --amber-ink:#1c1406;
  --air:#1d4e89;
  --warn:#7a3e06;
  --ok:#145c32;
}
*{box-sizing:border-box}
html{scrollbar-color:var(--green) var(--floor)}
html{background:var(--floor);color:var(--ink)}
body{margin:0;background:var(--floor);color:var(--ink);font-family:"PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", "Noto Sans SC", "Microsoft YaHei", "WenQuanYi Micro Hei", system-ui, sans-serif;font-size:13px;line-height:1.35;-webkit-font-smoothing:antialiased;overflow-wrap:anywhere}
::selection{background:var(--green-dim);color:var(--ink)}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}
button,input,select{font:inherit;color:inherit}
.vh{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.topbar{background:var(--green);color:var(--green-ink)}
.topbar :focus-visible{outline-color:var(--green-ink)}
.frame{max-width:1360px;margin:0 auto;padding-left:16px;padding-right:16px}
.barline{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-top:10px;padding-bottom:8px}
h1{margin:0;font-size:18px;line-height:1.2;font-weight:700;letter-spacing:-0.03em}
#upd{margin:0;font-size:12px;line-height:1.3;color:var(--green-dim);text-align:right}
.bar{position:sticky;top:0;z-index:5;background:var(--floor);border-bottom:1px solid var(--line);padding-top:6px;padding-bottom:6px}
.bar .frame{display:flex;flex-direction:column;gap:6px}
.search input,select{
  width:100%;background:var(--card);border:1px solid var(--line);border-radius:8px;
  min-height:44px;padding:8px 10px;font-size:16px;
}
.search input::placeholder{color:var(--ink-2)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;max-width:100%}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;min-height:40px;padding:0 12px;border-radius:999px;
  border:1px solid var(--line);background:var(--card);font-weight:700;font-size:13px;
}
.chip.on{background:var(--green);color:var(--green-ink);border-color:var(--green)}
.sels{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.week{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px;padding:8px 0 6px}
.week h2,.grp h2{margin:0;font-size:13px;line-height:1.3;font-weight:700;letter-spacing:-0.01em}
.week p{margin:0;font-size:13px;line-height:1.35;font-weight:600}
.wk{white-space:nowrap}
.week b{font-variant-numeric:tabular-nums}
.grp{margin:0 0 4px}
.grp h2{margin:10px 0 2px}
.grp h2 b{font-variant-numeric:tabular-nums}
.cols,.sum{
  display:grid;
  grid-template-columns:minmax(0,1.7fr) minmax(0,.85fr) minmax(0,1.05fr) minmax(0,.9fr) auto minmax(0,.72fr) minmax(0,1.05fr);
  column-gap:8px;align-items:center;
}
.cols{padding:3px 2px 2px;color:var(--ink-2);font-size:12px;font-weight:700;letter-spacing:0.02em}
.line{border-top:1px solid var(--line);min-width:0}
.line.bad{border-style:dashed}
.sum{
  width:100%;margin:0;padding:4px 2px;min-height:34px;text-align:left;background:transparent;border:0;border-radius:4px;
  cursor:pointer;scroll-margin-top:52px;
}
.sum:hover{background:rgba(27,60,48,.05)}
.sum:active{background:rgba(27,60,48,.09)}
.c{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.name{display:flex;align-items:center;gap:6px;font-size:15px;line-height:1.25;font-weight:700;letter-spacing:-0.02em;color:var(--ink)}
.name .nm{min-width:0;overflow:hidden;text-overflow:ellipsis}
.chev{width:10px;height:10px;flex:0 0 auto;display:block}
.sum[aria-expanded="true"] .chev{transform:rotate(180deg)}
.sup,.no,.car{font-size:12px;line-height:1.3;font-weight:600;color:var(--ink-2)}
.num{font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums lining-nums;letter-spacing:-0.01em}
.stage{display:inline-block;max-width:7.2rem;overflow:hidden;text-overflow:ellipsis;vertical-align:bottom;font-size:12px;font-weight:700;line-height:1.2;padding:2px 6px;border-radius:999px;background:#e7efe9;color:var(--green)}
.stage.ok{background:#e3f2e8;color:var(--ok)}
.stage.warn{background:#f8ead8;color:var(--warn)}
.destv{display:inline-block;max-width:100%;overflow:hidden;text-overflow:ellipsis;vertical-align:bottom;background:var(--amber);color:var(--amber-ink);border-radius:4px;padding:1px 6px;font-size:12px;font-weight:700;line-height:1.35}
.eta{font-size:12px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums lining-nums}
.why{font-weight:600;color:var(--warn)}
.miss{color:var(--warn);font-weight:700}
.panel{margin:0 0 4px;padding:8px 10px 10px 16px;background:var(--card);border-radius:4px}
.steps{display:flex;flex-wrap:wrap;gap:4px 10px;list-style:none;margin:0 0 6px;padding:0;font-size:12px;font-weight:700;color:var(--ink-2)}
.steps .now{color:var(--ink)}
.day{margin:8px 0 3px;font-size:12px;font-weight:700;color:var(--ink-2)}
.ev{display:grid;grid-template-columns:48px 10px minmax(0,1fr);gap:6px}
.ev .tm{font-size:12px;text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-2)}
.ev .dot{position:relative}
.ev .dot:before{content:"";position:absolute;left:4px;top:8px;bottom:-6px;width:1px;background:var(--line)}
.ev:last-child .dot:before{display:none}
.ev .dot:after{content:"";position:absolute;left:1px;top:5px;width:7px;height:7px;border-radius:50%;background:var(--line)}
.ev.f .dot:after{background:var(--green)}
.ev .bd{padding-bottom:6px;font-size:13px}
.ev .lc{color:var(--ink-2);font-size:12px;font-weight:600}
.note{margin:4px 0;font-size:13px;color:var(--ink-2);overflow-wrap:anywhere}
.note b{color:var(--ink);font-weight:700;margin-right:6px}
.proofs{display:flex;flex-direction:column;gap:8px;margin:6px 0}
.proof{margin:0}
.proof figcaption{font-size:13px;font-weight:700;margin:0 0 4px;color:var(--ink)}
.proof-open{display:block;width:100%;padding:0;border:0;background:#e4eeea;border-radius:6px;cursor:zoom-in}
.proof-open img{display:block;width:100%;max-height:240px;object-fit:contain}
.proof-cap{margin-top:4px;font-size:12px;color:var(--ink-2)}
.done-toggle{
  margin-top:8px;width:100%;min-height:36px;display:flex;align-items:center;gap:6px;
  background:transparent;border:0;border-top:1px solid var(--line);border-radius:0;
  color:var(--green);font-weight:700;font-size:13px;text-align:left;padding:8px 2px;cursor:pointer;
}
.done-toggle .chev{transform:none}
.done-toggle[aria-expanded="true"] .chev{transform:rotate(180deg)}
.empty{margin:12px 0;color:var(--ink-2)}
.empty button,.lb-x{
  min-height:40px;padding:0 14px;border-radius:8px;border:1px solid var(--green);
  background:var(--green);color:var(--green-ink);font-weight:700;
}
.colophon{margin:10px 0 22px;font-size:12px;color:var(--ink-2)}
.lb{position:fixed;inset:0;z-index:20;background:rgba(18,22,18,.9);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:64px 16px 24px;gap:10px}
.lb[hidden]{display:none}
.lb img{max-width:min(1100px,96vw);max-height:78vh;object-fit:contain;background:#111}
.lb-x{position:absolute;top:max(12px,env(safe-area-inset-top));right:12px}
#lbCap{color:#f3f6f1;font-size:14px;text-align:center;max-width:70ch}
@media (min-width:960px){
  .bar .frame{flex-direction:row;align-items:center;flex-wrap:nowrap;gap:8px}
  .search{flex:1 1 180px;min-width:140px}
  .search input,select{min-height:32px;font-size:13px;padding:4px 8px}
  .chips{flex:0 1 auto}
  .chip{min-height:32px;padding:0 10px}
  .sels{display:flex;flex:0 1 auto;gap:8px}
  .sels select{width:auto;max-width:9.2rem}
}
@media (max-width:959px){
  .cols{display:none}
  .sum{
    grid-template-columns:minmax(0,1fr) auto;
    row-gap:2px;padding:7px 0;min-height:0;
  }
  .c{white-space:normal}
  .c{overflow:visible;text-overflow:clip}
  .c.name{grid-column:1;grid-row:1;font-size:15px}
  .name .nm{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .c.st{grid-column:2;grid-row:1;justify-self:end;align-self:start}
  .c.eta{grid-column:1 / -1;grid-row:2}
  .c.sup{grid-column:1 / -1;grid-row:3}
  .c.no{grid-column:1 / -1;grid-row:4;text-align:left;max-width:none;overflow-wrap:anywhere}
  .c.car{grid-column:1;grid-row:5;padding-right:8px}
  .c.dest{grid-column:2;grid-row:5;justify-self:end;text-align:right}
  .panel{padding-left:0}
}
@media (max-width:390px){
  .frame{padding-left:12px;padding-right:12px}
}

/* Warm paper ledger; both views use the same shipment controls and details. */
body{font-size:14px;line-height:1.55}
.topbar{background:var(--floor);color:var(--ink);border-bottom:1px solid var(--line)}
.topbar :focus-visible{outline-color:var(--green)}
.frame{max-width:1360px;padding-inline:28px}
.barline{align-items:center;flex-wrap:wrap;padding-block:28px 22px;gap:16px}
h1{font-size:26px;letter-spacing:0;font-weight:650}
#upd{color:var(--ink-2);text-align:left;font-size:12px;margin-top:5px}
.view-switch{display:flex;gap:4px;border:1px solid var(--line);padding:3px;border-radius:10px;background:var(--card)}
.view-switch button{border:0;background:transparent;border-radius:6px;min-height:44px;min-width:68px;padding:8px 14px;cursor:pointer}
.view-switch button[aria-pressed="true"]{background:var(--green);color:var(--green-ink)}
.bar{position:static;padding-block:18px;border-bottom:0}
.bar .frame{gap:12px;flex-wrap:wrap}
.search input,select{min-height:44px;font-size:14px;border-radius:7px;padding:10px 12px;caret-color:var(--green)}
.chip{min-height:44px;border-radius:6px;font-weight:500;cursor:pointer}
.chips{gap:4px}
.sels select{min-width:0;max-width:none}
.reset{min-height:44px;padding:8px 12px;border:1px solid var(--line);background:var(--card);border-radius:7px;cursor:pointer}
.week{display:block;padding:18px 0 22px;border-bottom:1px solid var(--line);margin-bottom:26px}
.week h2{font-size:14px;color:var(--green);margin-bottom:6px}
.week p{font-size:14px;font-weight:400;line-height:1.7}
.wk{white-space:normal}
.grp{margin-bottom:30px}
.grp h2{font-size:16px;margin:0 0 14px;font-weight:600}
.grp h2 b{font-size:13px;font-weight:400;color:var(--ink-2);margin-left:8px}
.cols,.sum{grid-template-columns:minmax(0,2.1fr) minmax(0,.85fr) minmax(0,1.15fr) minmax(0,.8fr) minmax(0,.8fr) minmax(0,.6fr) minmax(0,1.4fr);column-gap:16px}
.cols{padding:0 12px 10px;font-weight:400;font-size:12px}
.sum{padding:17px 12px;min-height:76px;border-radius:6px;scroll-margin-top:16px}
.c{white-space:normal;overflow:visible;text-overflow:clip;overflow-wrap:anywhere}
.name{font-size:18px;line-height:1.45;font-weight:650;letter-spacing:0;align-items:baseline;gap:10px}
.name .nm{overflow:visible;white-space:normal;display:block}
.sup,.no,.car{font-size:13px;font-weight:400;line-height:1.5}
.num{font-weight:500;color:var(--ink-2)}
.chev{width:12px;height:12px}
.stage{font-size:12px;font-weight:500;padding:4px 7px;line-height:1.45;white-space:normal;max-width:100%;overflow:visible;border-radius:5px}
.destv{background:transparent;color:var(--ink-2);font-weight:400;padding:0;font-size:13px;overflow:visible}
.eta{font-size:13px;font-weight:500;line-height:1.5}
.eta-label{display:none}
.eta-note{display:block;color:var(--ink-2);font-size:12px;font-weight:400;margin-top:3px;line-height:1.5}
.why,.miss{font-weight:500}
.panel{padding:18px 22px;margin-bottom:12px;border-radius:6px}
.done-toggle{min-height:52px;font-size:14px;padding:12px;color:var(--ink-2)}
.empty button,.lb-x{min-height:44px}
.proof-open{min-height:44px}
.colophon{font-size:12px;margin-block:32px;line-height:1.7}
.card-grid{display:block}
[data-view="cards"] .card-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:start}
[data-view="cards"] .cols{display:none}
[data-view="cards"] .line{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
[data-view="cards"] .sum{display:flex;flex-direction:column;align-items:stretch;gap:7px;padding:20px}
[data-view="cards"] .name{margin-bottom:5px;order:-3}
[data-view="cards"] .st{order:-1;align-self:flex-start}
[data-view="cards"] .c.eta{order:-2}
[data-view="cards"] .eta-label{display:inline;font-weight:400;color:var(--ink-2);margin-right:6px}
[data-view="cards"] .panel{margin:0;padding:18px 20px;border-top:1px solid var(--line)}
.meta-label{display:none;color:var(--ink-2);font-size:12px;margin-right:6px}
[data-view="cards"] .meta-label{display:inline}
@media(min-width:960px){
 .search{flex:1 1 220px}.sels{flex:1 1 400px}.sels select{flex:1;width:0}
}
@media(max-width:1100px) and (min-width:700px){[data-view="cards"] .card-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:959px){
 .frame{padding-inline:20px}.barline{padding-block:22px 16px}
 .bar .frame{display:grid;grid-template-columns:minmax(0,1fr)}
 .sels{gap:8px}.search input,select{font-size:16px}
 .cols{display:none}.sum{grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;padding:16px 0;min-height:44px}
 .c.name{grid-column:1/-1;grid-row:1;font-size:18px}.name .nm{display:block;-webkit-line-clamp:unset;overflow:visible}
 .c.st{grid-column:2;grid-row:2;align-self:center}.c.eta{grid-column:1;grid-row:2}
 .c.sup{grid-column:1/-1;grid-row:3}.c.no{grid-column:1/-1;grid-row:4}
 .c.car{grid-column:1;grid-row:5}.c.dest{grid-column:2;grid-row:5}
 .meta-label,.eta-label{display:inline;font-size:12px;color:var(--ink-2);font-weight:400;margin-right:6px}
 .panel{padding:16px}.week{margin-bottom:22px;padding-top:8px}
 [data-view="cards"] .card-grid{grid-template-columns:1fr}
 [data-view="cards"] .c.st{align-self:flex-start}
}
@media(max-width:420px){.frame{padding-inline:16px}h1{font-size:23px}.view-switch button{min-width:58px;padding-inline:10px}.barline{gap:12px}.sels{grid-template-columns:repeat(2,minmax(0,1fr))}.sels select{width:100%}.bar .frame{gap:10px}}

</style>
</head>
<body>
<header class="topbar">
  <div class="frame barline">
    <div><h1>集运追踪</h1><p id="upd" role="status">正在读取运单</p></div>
    <div class="view-switch" role="group" aria-label="显示方式"><button type="button" data-view-btn="list" aria-pressed="true">列表</button><button type="button" data-view-btn="cards" aria-pressed="false">卡片</button></div>
  </div>
</header>
<div class="bar">
  <div class="frame">
    <label class="vh" for="q">搜索</label>
    <div class="search"><input id="q" placeholder="厂家、品名、单号、承运、目的地" autocomplete="off" enterkeyhint="search" spellcheck="false"></div>
    <div class="chips" id="modes"></div>
    <div class="sels">
      <select id="fStage" aria-label="阶段"></select>
      <select id="fSup" aria-label="厂家"></select>
      <select id="fFw" aria-label="货代"></select>
      <button type="button" class="reset" id="reset">清除筛选</button>
    </div>
  </div>
</div>
<main class="frame" id="main" data-view="list"></main>
<p class="frame colophon">时间是马来西亚时间 (MYT)。页面不含电话、地址、联系人。预计到马只取运单上的日期和轨迹，没有的标待确认。</p>
<div id="lightbox" class="lb" role="dialog" aria-modal="true" aria-label="证据图片" hidden>
  <button type="button" class="lb-x" id="lbX">关闭</button>
  <div id="lbCap"></div>
</div>
<script>
(function () {
  const ui = {
    upd: document.getElementById('upd'),
    main: document.getElementById('main'),
    q: document.getElementById('q'),
    modes: document.getElementById('modes'),
    fStage: document.getElementById('fStage'),
    fSup: document.getElementById('fSup'),
    fFw: document.getElementById('fFw'),
    lightbox: document.getElementById('lightbox'),
    lbCap: document.getElementById('lbCap'),
    lbX: document.getElementById('lbX')
  };
  const TBD = '待确认';
  const OPEN = new Set();
  let doneOpen = false;
  let view = 'list';
  try { if (localStorage.getItem('shipment-tracker-view') === 'cards') view = 'cards'; } catch (e) {}
  function applyView() {
    ui.main.dataset.view = view;
    document.querySelectorAll('[data-view-btn]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.viewBtn === view)));
  }
  applyView();
  document.querySelectorAll('[data-view-btn]').forEach(b => b.addEventListener('click', () => {
    view = b.dataset.viewBtn;
    try { localStorage.setItem('shipment-tracker-view', view); } catch (e) {}
    applyView();
  }));
  let D = { cons: [], pk: [], solo: [], fws: [], updated: '' };
  const F = { m: 'all', st: 'all', sup: 'all', fw: 'all', q: '' };
  let fmt = null;
  let wdFmt = null;
  try { fmt = new Intl.DateTimeFormat('zh-CN', { timeZone: 'Asia/Kuala_Lumpur', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', weekday: 'short', hourCycle: 'h23' }); }
  catch (e1) {
    try { fmt = new Intl.DateTimeFormat('zh-CN', { timeZone: 'Asia/Kuala_Lumpur', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', weekday: 'short' }); }
    catch (e2) { fmt = null; }
  }
  try { wdFmt = new Intl.DateTimeFormat('en-US', { timeZone: 'Asia/Kuala_Lumpur', weekday: 'short' }); }
  catch (e3) { wdFmt = null; }

  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const scrub = s => String(s ?? '').replace(/(地址|联系人|收件人|电话|手机)[^；;\n]*/g, '$1 [已隐藏]').replace(/(\+?6?01\d[-\s]?\d{3,4}[-\s]?\d{4})|(\+?86[-\s]?)?\b1[3-9]\d{9}\b/g, '[已隐藏]');
  const text = v => (v == null || typeof v === 'object') ? '' : String(v).trim();
  const has = v => {
    const s = text(v);
    if (!s) return false;
    if (/^(待确认|待查|unknown|n\/a|null|\?+|-)$/i.test(s)) return false;
    if (/^待(确认|查)\s*[（(]\s*(厂家|品名|货品|供应商|单号)?\s*[)）]\s*$/.test(s)) return false;
    return true;
  };
  const T = v => esc(scrub(v));
  const asList = v => (v == null || v === '') ? [] : (Array.isArray(v) ? v : [v]);

  function safeSrc(src) {
    let s = String(src ?? '').trim();
    if (!s) return '';
    try { s = decodeURI(s); } catch (e) { return ''; }
    s = s.replace(/^\.\//, '');
    if (/^[a-z][a-z0-9+.-]*:/i.test(s) || s.startsWith('//') || s.includes('\\') || s.split('/').includes('..')) return '';
    if (s.startsWith('/')) s = s.slice(1);
    if (!s.startsWith('evidence/')) return '';
    const path = s.split('?')[0].split('#')[0];
    if (!/\.(png|jpe?g|webp|gif)$/i.test(path) || /[<>"']/.test(path)) return '';
    return path;
  }
  function noteText(x) {
    if (x == null || x === '') return '';
    if (typeof x !== 'object') {
      const s = String(x), m = s.match(/^https?:\/\/([^\/?#]+)/i);
      return m ? '链接 ' + m[1] : s;
    }
    const url = String(x.url || x.src || x.path || '');
    const m = url.match(/^https?:\/\/([^\/?#]+)/i);
    const label = x.caption || x.text || x.desc || x.description || x.note || '';
    if (m) return (label ? String(label) + ' ' : '链接 ') + m[1];

      if (c._all && c._all.length) continue;
      try { rows.push(modelCons(c)); }
      catch (e) { rows.push({ key: 'c:' + (c && c.id || ''), id: c && c.id || '', kind: 'cons', bad: true, item: '', supplier: '', supplierKey: TBD, stage: '', mode: c && c.mode === 'sea' ? 'sea' : 'air', no: '', noTitle: '', carrier: '', place: '', fw: TBD, eta: { kind: 'unknown', ymd: '', text: 'ETA 未知', why: '这条读不了', whyFull: '这条读不了' }, delivered: false, decide: ['这条读不了'], raw: c, parent: null }); }
    }
    return rows;
  }
  function blob(r) {
    try {
      const o = r.raw || {};
      const parent = r.parent;
      return [r.item, r.supplier, r.no, r.noTitle, r.carrier, r.place, r.stage, r.id, r.eta.text, r.eta.why, etaNoteOf(r.raw, r.parent), r.vessel, o.hint, o.forwarder, o.mark, o.warehouse_ref, parent && parent.id, parent && parent.tracking_no].join(' ').toLowerCase();
    } catch (e) { return ''; }
  }
  function visible(r) {
    if (F.m === 'sea' && r.mode !== 'sea') return false;
    if (F.m === 'air' && r.mode !== 'air') return false;
    if (F.m === 'solo' && r.mode !== 'solo') return false;
    if (F.st !== 'all' && r.stage !== F.st) return false;
    if (F.sup !== 'all' && r.supplierKey !== F.sup) return false;
    if (F.fw !== 'all' && r.fw !== F.fw) return false;
    if (F.q && blob(r).indexOf(F.q.toLowerCase()) === -1) return false;
    return true;
  }
  function panel(r) {
    if (r.bad) return '<div class="panel"><p class="note">这条读不了，其他单照常显示。</p></div>';
    const o = r.raw || {};
    const parent = r.parent;
    const bits = [r.id, parent && parent.id ? '随 ' + parent.id : '', r.mode === 'sea' ? '海运' : r.mode === 'air' ? '空运' : '未分配'];
    let html = `<p class="note"><b>单</b>${T(bits.filter(Boolean).join(' · '))}</p>`;
    html += `<p class="note"><b>预计到马</b>${T(r.eta.whyFull || r.eta.text)}</p>`;
    if (r.decide.length) html += `<p class="note"><b>待拍板</b>${T(r.decide.join('；'))}</p>`;
    if (r.kind === 'cons') html += steps(o.stage, CST, o.mode);
    else if (!parent) html += steps(o.stage, PST, null);
    else html += steps(parent.stage, CST, parent.mode);
    const ownH = Array.isArray(o._h) ? o._h : [];
    const parH = parent && Array.isArray(parent._h) ? parent._h : [];
    if (r.kind === 'parcel' && ownH.length) html += timeline(ownH);
    if (parH.length) html += `<div class="day">集运轨迹 ${T(parent.id || '')}</div>` + timeline(parH);
    if (r.kind === 'cons' && ownH.length) html += timeline(ownH);
    if (!ownH.length && !parH.length) html += '<p class="note">暂无物流轨迹</p>';
    const seenImg = new Set();
    html += proofGallery(evOf(o), seenImg);
    if (parent) html += proofGallery(evOf(parent), seenImg);
    const notes = extras(o).notes;
    html += notes.map(([k, v]) => `<p class="note"><b>${esc(k)}</b>${T(v)}</p>`).join('');
    if (parent) {
      const pn = extras(parent).notes.filter(([k]) => k === '备注' || k === '未核实' || k === '船');
      html += pn.map(([k, v]) => `<p class="note"><b>集运${esc(k)}</b>${T(v)}</p>`).join('');
    }
    const checked = o.last_checked || (parent && parent.last_checked) || '';
    if (checked) html += `<p class="note"><b>检查</b>${when(checked)}</p>`;
    return `<div class="panel">${html}</div>`;
  }
  function htmlRow(r) {
    const open = OPEN.has(r.key);
    const name = r.item ? T(r.item) : '<span class="miss">缺品名</span>';
    const sup = r.supplier ? T(r.supplier) : '<span class="miss">缺厂家</span>';
    const no = r.no ? `<b class="num">${T(r.no)}</b>` : '<span class="miss">暂无单号</span>';
    const car = r.carrier ? T(r.carrier) : '<span class="miss">缺承运商</span>';
    const dest = r.place ? T(r.place) : '缺目的地';
    const why = r.eta.why ? ` <span class="why">${T(r.eta.why)}</span>` : '';
    return `<article class="line${r.bad ? ' bad' : ''}" data-id="${esc(r.id)}" data-group="${r.delivered ? 'done' : r.decide.length ? 'decide' : 'go'}">
      <button type="button" class="sum" data-k="${esc(r.key)}" aria-expanded="${open ? 'true' : 'false'}">
        <span class="c name" title="${esc(r.item || '缺品名')}">${chev}<span class="nm">${name}</span></span>
        <span class="c sup" title="${esc(r.supplier || '缺厂家')}"><span class="meta-label">厂家</span>${sup}</span>
        <span class="c no" title="${esc(r.noTitle || r.no || '暂无单号')}"><span class="meta-label">单号</span>${no}</span>
        <span class="c car" title="${esc(r.carrier || '缺承运商')}"><span class="meta-label">承运</span>${car}</span>
        <span class="c st">${stageChip(r.stage)}</span>
        <span class="c dest"><span class="meta-label">寄往</span><span class="destv">${dest}</span></span>
        <span class="c eta" title="${esc(r.eta.whyFull || r.eta.text)}"><span class="eta-label">预计到马</span><span class="eta">${T(r.eta.text)}</span>${why}${etaNoteOf(r.raw, r.parent) ? `<span class="eta-note">${T(etaNoteOf(r.raw, r.parent))}</span>` : ''}</span>
      </button>
      ${open ? panel(r) : ''}
    </article>`;
  }
  const HEAD = `<div class="cols" aria-hidden="true"><span>品名</span><span>厂家</span><span>单号</span><span>承运</span><span>阶段</span><span>寄往</span><span>预计到马</span></div>`;
  function groupBlock(title, rows) {
    if (!rows.length) return '';
    return `<section class="grp"><h2>${esc(title)} <b>${rows.length}</b></h2>${HEAD}<div class="card-grid">${rows.map(htmlRow).join('')}</div></section>`;
  }
  function weekCopy(rows) {
    const bounds = weekBounds(new Date());
    if (!bounds) return '到港日期暂时排不出来';
    const groups = new Map();
    for (const r of rows) {
      if (r.eta.kind !== 'eta' || !r.eta.ymd || r.eta.ymd < bounds.today) continue;
      const place = r.place || '缺目的地';
      const key = r.eta.ymd + '|' + place;
      if (!groups.has(key)) groups.set(key, { ymd: r.eta.ymd, place, n: 0 });
      groups.get(key).n += 1;
    }
    const list = [...groups.values()].sort((a, b) => a.ymd.localeCompare(b.ymd) || a.place.localeCompare(b.place, 'zh'));
    const fmt = g => `<span class="wk">${esc(mdLong(g.ymd))} ${esc(g.place)} ${g.n}件</span>`;
    const week = list.filter(g => g.ymd >= bounds.start && g.ymd <= bounds.end);
    const later = list.filter(g => g.ymd > bounds.end);
    const bits = [week.length ? week.map(fmt).join(' · ') : '<span class="wk">本周无到港</span>'];
    if (later.length) bits.push('最近 ' + later.map(fmt).join(' · '));
    return bits.join(' · ');
  }

  function render() {
    const focusKey = document.activeElement && document.activeElement.getAttribute && (document.activeElement.hasAttribute('data-done') ? 'done' : document.activeElement.getAttribute('data-k'));
    try {
      const rows = allRows().filter(visible);
      const dec = [], mid = [], done = [];
      for (const r of rows) {
        if (r.delivered) done.push(r);
        else if (r.decide.length) dec.push(r);
        else mid.push(r);
      }
      dec.sort(cmpRow); mid.sort(cmpRow); done.sort(cmpRow);
      const openDone = doneOpen;
      let h = `<div class="week"><h2>本周到货</h2><p>${weekCopy(rows)}</p></div>`;
      h += groupBlock('要 Nick 拍板', dec);
      h += groupBlock('进行中', mid);
      if (done.length) {
        h += `<section class="grp"><button type="button" class="done-toggle" data-done aria-expanded="${openDone ? 'true' : 'false'}">${chev}<span>已签收 ${done.length}</span></button>${openDone ? HEAD + '<div class="card-grid">' + done.map(htmlRow).join('') + '</div>' : ''}</section>`;
      }
      if (!dec.length && !mid.length && !done.length) h += '<p class="empty">没有符合的货。可清除筛选重新查看。</p>';
      ui.main.innerHTML = h;
      if (focusKey === 'done') {
        const again = ui.main.querySelector('[data-done]');
        if (again) again.focus();
      } else if (focusKey) {
        const again = ui.main.querySelector('[data-k="' + (window.CSS && CSS.escape ? CSS.escape(focusKey) : focusKey) + '"]');
        if (again) again.focus();
      }
    } catch (e) {
      ui.upd.textContent = '名单已载入，这一屏没排出来';
      ui.main.innerHTML = '<p class="empty">刷新再试。单条坏数据会单独标出，不应停在这里。</p>';
    }
  }

  function fillSelect(sel, html, value, key) {
    sel.innerHTML = html;
    const ok = Array.prototype.some.call(sel.options, o => o.value === value);
    sel.value = ok ? value : 'all';
    if (!ok) F[key] = 'all';
  }
  function setup() {
    const rows = allRows();
    const n = {
      all: rows.length,
      sea: rows.filter(r => r.mode === 'sea').length,
      air: rows.filter(r => r.mode === 'air').length,
      solo: rows.filter(r => r.mode === 'solo').length
    };
    ui.modes.innerHTML = [['all', '全部'], ['sea', '海运'], ['air', '空运'], ['solo', '未分配']].map(([k, l]) => `<button type="button" class="chip ${F.m === k ? 'on' : ''}" data-m="${k}" aria-pressed="${F.m === k}">${l} ${n[k]}</button>`).join('');
    const st = [...new Set(rows.map(r => r.stage).filter(has))].sort((a, b) => String(a).localeCompare(String(b), 'zh'));
    fillSelect(ui.fStage, '<option value="all">全部阶段</option>' + st.map(x => `<option value="${esc(text(x))}">${esc(text(x))}</option>`).join(''), F.st, 'st');
    const sp = [...new Set(rows.map(r => r.supplierKey))].sort((a, b) => String(a).localeCompare(String(b), 'zh'));
    fillSelect(ui.fSup, '<option value="all">全部厂家</option>' + sp.map(x => `<option value="${esc(x)}">${esc(x === TBD ? '缺厂家' : x)}</option>`).join(''), F.sup, 'sup');
    const fw = [...new Set(rows.map(r => r.fw))].sort((a, b) => String(a).localeCompare(String(b), 'zh'));
    fillSelect(ui.fFw, '<option value="all">全部货代</option>' + fw.map(x => `<option value="${esc(x)}">${esc(x === TBD ? '缺货代' : x)}</option>`).join(''), F.fw, 'fw');
  }

  let proofTrigger = null;
  function openLb(btn) {
    proofTrigger = btn;
    let img = ui.lightbox.querySelector('img');
    if (!img) {
      img = document.createElement('img');
      ui.lightbox.insertBefore(img, ui.lbCap);
    }
    img.alt = btn.getAttribute('data-alt') || '证据';
    img.src = btn.getAttribute('data-src') || '';
    ui.lbCap.textContent = btn.getAttribute('data-cap') || btn.getAttribute('data-alt') || '';
    ui.lightbox.hidden = false;
    ui.lbX.focus();
  }
  function closeLb() {
    ui.lightbox.hidden = true;
    const img = ui.lightbox.querySelector('img');
    if (img) img.remove();
    ui.lbCap.textContent = '';
    if (proofTrigger && proofTrigger.isConnected) proofTrigger.focus();
    proofTrigger = null;
  }
  ui.main.addEventListener('click', e => {
    const pic = e.target.closest && e.target.closest('.proof-open');
    if (pic) { openLb(pic); return; }
    const done = e.target.closest && e.target.closest('[data-done]');
    if (done) { doneOpen = !doneOpen; render(); return; }
    const b = e.target.closest && e.target.closest('.sum');
    if (!b) return;
    const k = b.getAttribute('data-k');
    if (OPEN.has(k)) OPEN.delete(k); else OPEN.add(k);
    render();
  });
  ui.main.addEventListener('error', e => {
    const img = e.target;
    if (!img || img.tagName !== 'IMG') return;
    const p = document.createElement('p');
    p.className = 'note';
    p.textContent = '图片打不开';
    img.replaceWith(p);
  }, true);
  ui.lightbox.addEventListener('click', e => { if (e.target === ui.lightbox) closeLb(); });
  ui.lbX.addEventListener('click', closeLb);
  document.addEventListener('keydown', e => {
    if (ui.lightbox.hidden) return;
    if (e.key === 'Escape') closeLb();
    if (e.key === 'Tab') { e.preventDefault(); ui.lbX.focus(); }
  });
  function markFilters() {
    if (F.m !== 'all' || F.st !== 'all' || F.sup !== 'all' || F.fw !== 'all' || F.q) doneOpen = true;
  }
  ui.q.addEventListener('input', () => { F.q = ui.q.value.trim(); markFilters(); render(); });
  ui.fStage.addEventListener('change', () => { F.st = ui.fStage.value; markFilters(); render(); });
  ui.fSup.addEventListener('change', () => { F.sup = ui.fSup.value; markFilters(); render(); });
  ui.fFw.addEventListener('change', () => { F.fw = ui.fFw.value; markFilters(); render(); });
  ui.modes.addEventListener('click', e => {
    const b = e.target.closest && e.target.closest('.chip');
    if (!b) return;
    F.m = b.getAttribute('data-m') || 'all';
    markFilters();
    setup();
    render();
    ui.modes.querySelector('[data-m="' + F.m + '"]').focus();
  });

  document.getElementById('reset').addEventListener('click', () => {
    Object.assign(F, { m: 'all', st: 'all', sup: 'all', fw: 'all', q: '' });
    ui.q.value = ''; doneOpen = false; setup(); render();
  });

  function ingest(d) {
    if (!d || typeof d !== 'object') throw new Error('bad json');
    const rawPk = Array.isArray(d.parcels) ? d.parcels : [];
    const rawC = Array.isArray(d.consolidations) ? d.consolidations : (Array.isArray(d.consignments) ? d.consignments : []);
    const pk = rawPk.filter(p => p && typeof p === 'object').map(p => Object.assign({}, p, {
      consolidation_id: p.consolidation_id ?? p.consignment_id ?? null,
      _h: hist(p.history)
    }));
    const cons = rawC.filter(c => c && typeof c === 'object').map(c => {
      const ids = Array.isArray(c.parcel_ids) ? c.parcel_ids : (Array.isArray(c.parcels) ? c.parcels : []);
      const all = pk.filter(p => p.consolidation_id === c.id || ids.indexOf(p.id) !== -1);
      all.forEach(p => { p._in = 1; });
      return Object.assign({}, c, { ctns: c.ctns ?? c.total_ctns, _h: hist(c.history), _all: all });
    });
    D = { cons, pk, solo: pk.filter(p => !p._in), fws: Array.isArray(d.forwarders) ? d.forwarders : [], updated: d.updated || '' };
  }
  function failLoad() {
    ui.upd.textContent = '运单没有载入';
    ui.main.innerHTML = '<p class="empty">网络或 shipments.json 有问题。<button type="button" id="retry">重试</button></p>';
    const b = document.getElementById('retry');
    if (b) b.addEventListener('click', load);
  }
  function load() {
    ui.upd.textContent = '正在读取运单';
    const src = new URLSearchParams(location.search).get('data') || 'shipments.json';
    fetch(src + '?' + Date.now(), { cache: 'no-store' }).then(r => {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    }).then(d => {
      ingest(d);
      const stamp = parts(parseT(D.updated));
      ui.upd.textContent = stamp ? `更新 ${+stamp.month}月${+stamp.day}日 ${stamp.hour}:${stamp.minute} MYT` : ('更新 ' + (D.updated ? String(D.updated) : '时间未知'));
      try { setup(); render(); }
      catch (e) {
        ui.upd.textContent = '名单已载入，排版中断';
        ui.main.innerHTML = '<p class="empty">数据在，页面没排出来。刷新再试。</p>';
      }
    }).catch(failLoad);
  }
  const missing = Object.keys(ui).filter(k => !ui[k]);
  if (missing.length) {
    const host = document.getElementById('upd') || document.body;
    host.textContent = '页面缺了 ' + missing.join(', ');
  } else load();
})();
</script>
</body>
</html>
